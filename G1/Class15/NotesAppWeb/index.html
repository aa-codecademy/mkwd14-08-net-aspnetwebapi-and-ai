<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notes App TEST</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/site.css" rel="stylesheet" />
</head>

<body>

    <!-- ONE page. Both screens are in here, and JavaScript decides which one you
         can see. The browser never loads a second HTML file - that is the whole
         idea behind "single page application". -->

    <!-- Only visible once you are logged in. -->
    <nav class="navbar navbar-expand bg-body-tertiary border-bottom d-none" id="navbar">
        <div class="container">
            <span class="navbar-brand mb-0 h1">📝 Notes App</span>

            <div class="ms-auto d-flex align-items-center gap-3">
                <span class="text-body-secondary small" id="currentUser"></span>
                <button type="button" class="btn btn-sm btn-outline-secondary" id="logoutButton">Log out</button>
            </div>
        </div>
    </nav>

    <!-- ===================== VIEW: login (#/login) ===================== -->
    <section class="view login-view d-none" id="loginView">
        <div class="login-card">

            <div class="text-center mb-4">
                <div class="brand-mark">📝</div>
                <h1 class="h3 mb-1">Notes App</h1>
                <p class="text-body-secondary mb-0">Sign in to see your notes</p>
            </div>

            <!-- Hidden until something goes wrong. The message comes from the API. -->
            <div id="loginError" class="alert alert-danger d-none" role="alert"></div>

            <!-- novalidate turns OFF the browser's own bubbles so Bootstrap can style them -->
            <form id="loginForm" class="card shadow-sm" novalidate>
                <div class="card-body p-4">

                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" autocomplete="username" required />
                        <div class="invalid-feedback">Username is required.</div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" autocomplete="current-password"
                            required />
                        <div class="invalid-feedback">Password is required.</div>
                    </div>

                    <button type="submit" id="loginButton" class="btn btn-primary w-100">
                        <span id="loginSpinner" class="spinner-border spinner-border-sm d-none"
                            aria-hidden="true"></span>
                        <span id="loginButtonText">Log in</span>
                    </button>

                </div>
            </form>

            <!-- Classroom convenience. Delete this block before showing anyone the app. -->
            <div class="card mt-3 border-0 bg-body-tertiary">
                <div class="card-body py-3">
                    <p class="small text-body-secondary mb-2">Seeded accounts:</p>
                    <div class="d-flex flex-wrap gap-2">
                        <button type="button" class="btn btn-sm btn-outline-secondary js-demo-user" data-username="bob"
                            data-password="SuperSecret123">bob</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary js-demo-user"
                            data-username="petko" data-password="AlsoSecret456">petko</button>
                    </div>
                </div>
            </div>

        </div>
    </section>

    <!-- ===================== VIEW: notes (#/notes) ===================== -->
    <section class="view d-none" id="notesView">
        <div class="container py-4">

            <div class="d-flex flex-wrap gap-2 align-items-center mb-4">
                <h1 class="h4 mb-0 me-auto">My notes</h1>

                <!-- Feeds GET /api/notes?priority=... The API does the filtering, not us. -->
                <select class="form-select form-select-sm w-auto" id="priorityFilter">
                    <option value="">All priorities</option>
                    <option value="1">Low</option>
                    <option value="2">Medium</option>
                    <option value="3">High</option>
                </select>

                <button type="button" class="btn btn-primary btn-sm" id="newNoteButton">+ New note</button>
            </div>

            <div id="notesError" class="alert alert-danger d-none" role="alert"></div>

            <div id="loading" class="text-center py-5 d-none">
                <div class="spinner-border text-primary" role="status"></div>
            </div>

            <div id="emptyState" class="text-center py-5 d-none">
                <p class="fs-1 mb-2">🗒️</p>
                <p class="text-body-secondary">No notes yet. Create your first one.</p>
            </div>

            <!-- Every card is rendered here by notes.js -->
            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3" id="notesContainer"></div>

        </div>
    </section>

    <!-- ===== Add / edit modal. One modal for both - the hidden id decides which. ===== -->
    <div class="modal fade" id="noteModal" tabindex="-1">
        <div class="modal-dialog">
            <form class="modal-content" id="noteForm" novalidate>

                <div class="modal-header">
                    <h5 class="modal-title" id="noteModalTitle">New note</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">

                    <!-- Empty => POST (create). Has a value => PUT (update). -->
                    <input type="hidden" id="noteId" />

                    <div id="modalError" class="alert alert-danger d-none" role="alert"></div>

                    <div class="mb-3">
                        <label for="noteText" class="form-label">Text</label>
                        <textarea class="form-control" id="noteText" rows="3" maxlength="100" required></textarea>
                        <!-- 100 is the API's own limit, from NoteService.ValidateText -->
                        <div class="form-text"><span id="charCount">0</span>/100 characters</div>
                        <div class="invalid-feedback">Text is required.</div>
                    </div>

                    <div class="mb-3">
                        <label for="notePriority" class="form-label">Priority</label>
                        <select class="form-select" id="notePriority" required>
                            <option value="1">Low</option>
                            <option value="2" selected>Medium</option>
                            <option value="3">High</option>
                        </select>
                    </div>

                    <div class="mb-1">
                        <label class="form-label">Tags</label>
                        <!-- Checkboxes are built from TAGS in config.js -->
                        <div id="tagCheckboxes" class="d-flex flex-wrap gap-3"></div>
                    </div>

                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveNoteButton">Save</button>
                </div>

            </form>
        </div>
    </div>

    <!-- ===== Delete confirmation ===== -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog modal-sm">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Delete note</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-0">Delete "<span id="deleteNoteText" class="fw-semibold"></span>"?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirmDeleteButton">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap is a plain old script, so it becomes a global: window.bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- ONE script tag. type="module" means our files use import/export, so the
         browser works the load order out from the imports - app.js asks for
         router.js, router.js asks for nothing, and so on.
         Two things come with it, both good: modules are deferred automatically
         (the DOM is ready before any of our code runs), and nothing leaks onto
         window - a variable in api.js is invisible to notes.js unless it is
         exported and imported by name. -->
    <script type="module" src="js/app.js"></script>
</body>

</html>
